# The community resource directory rendered on /resources.
- title: "Town Offices & Resources"
  entries:
    - name: "Town of Needham"
      desc: "The town government — includes all departments, boards, and committees"
      href: "https://www.needhamma.gov/"
      cont: "needhamma.gov"
    - name: "SeeClickFix"
      desc: "Report non-emergency issues — potholes, blown streetlights, downed signs, public-way problems — directly to the DPW and track the status of your request."
      href: "https://seeclickfix.com/needham"
      cont: "seeclickfix.com"
    - name: "Alert Needham"
      desc: "The town's official \"reverse-911\" emergency notification system — sends alerts (evacuation, shelter-in-place, hazmat, infrastructure issues) to your phone, cell, or email."
      href: "https://getrave.com/login/needhamma"
      cont: "getrave.com"
    - name: "Smart911"
      desc: "National service where you can pre-register household info (medical needs, pets, home access details) so 911 dispatchers see it automatically if you call. Recommended alongside Alert Needham."
      href: "https://www.smart911.com/smart911/ref/reg.action?pa=needhamma%20"
      cont: "smart911.com"
    - name: "Recycling & Transfer Station (\"The Dump\")"
      desc: "Needham has no curbside trash pickup — residents use the RTS with pay-as-you-throw bags. This page covers hours, sticker requirements, and what's accepted."
      href: "https://www.needhamma.gov/262/Recycling-Solid-Waste-Division"
      cont: "needhamma.gov"
    - name: "Park & Rec Online Registration"
      desc: "Register for youth/adult recreation programs, camps, and facility rentals run by the town (as opposed to the independent youth sports leagues)."
      href: "https://www.rec.us/organizations/needham"
      cont: "rec.us"
    - name: "Voter Registration & Elections Info"
      desc: "Check your voter registration status, find your polling place, and request an absentee/vote-by-mail ballot."
      href: "https://www.needhamma.gov/524/Voter-Registration-Information"
      cont: "needhamma.gov"
    - name: "Needham Adult & Community Ed"
      desc: "Explore and register for a variety of adult and community education courses, workshops, and lessons,"
      href: "https://nce.reg.eleyo.com/courses/category/1/adult-education"
      cont: "nce.reg.eleyo.com"
- title: "Arts & Culture"
  entries:
    - name: "Chinese Friends of Needham (CFN)"
      desc: "501(c)(3) founded 2010 to preserve and celebrate Chinese culture/heritage and build the Asian-American community in and around Needham."
      href: "https://www.facebook.com/mycfn.org/"
      cont: "Facebook"
    - name: "Indian Community of Needham (ICON)"
      desc: "Nonprofit bringing together Indian families in Needham through cultural festivals (Diwali, Holi, India Day) and community-building events."
      href: "https://www.iconeedham.org/"
      cont: "iconeedham.org"
    - name: "Needham Art Association"
      desc: "Founded 1949; promotes visual arts and art education via exhibits, demonstrations, and an annual scholarship for a Needham HS senior."
      href: "https://needhamartassociation.org/"
      cont: "needhamartassociation.org"
    - name: "Needham Community Theatre"
      desc: "Community theater group founded 1956; stages a fall musical and spring play each year with local volunteer casts and crews."
      href: "https://www.needhamtheatre.org/"
      cont: "needhamtheatre.org"
    - name: "Needham Concert Society"
      desc: "Founded 1976 by former BSO trombonist William Gibson; presents a season of professional chamber-music concerts plus student festivals."
      href: "https://needhamconcertsociety.org"
      cont: "needhamconcertsociety.org"
    - name: "Needham History Center & Museum"
      desc: "Formerly the Needham Historical Society (est. 1915); preserves and shares Needham's history through exhibits, archives, and school outreach"
      href: "https://needhamhistory.org/"
      cont: "needhamhistory.org"
    - name: "Needham Open Studios"
      desc: "501(c)(3) organizing an annual weekend where local artists open their home studios to the public (26th year running)."
      href: "https://www.needhamopenstudios.com/"
      cont: "needhamopenstudios.com"
    - name: "Homegrown Coffeehouse"
      desc: "Long-running (30+ years) all-volunteer folk-music concert series hosted at First Parish Unitarian Universalist Church in Needham Center."
      href: "https://uuneedham.org/events/homegrown-coffeehouse/"
      cont: "uuneedham.org"
    - name: "Gorse Mill Studios"
      desc: "A converted 1893 mill building where artists individually own or lease studio space and host events"
      href: "https://www.gorsemillstudios.com/"
      cont: "gorsemillstudios.com"
    - name: "Needham Council for Arts & Culture"
      desc: "Town-appointed cultural council (distinct from Needham Art Association) that funds local arts programming and organizes events like New Year's Needham and the Spring Arts Festival."
      href: "https://www.needhamma.gov/1111/Needham-Council-for-Arts-Culture"
      cont: "needhamma.gov"
    - name: "Quinobequin Quilters Guild"
      desc: "Local quilting guild, listed among Needham's community arts groups with meetings at the Congregational Church"
      href: "https://www.quinobequin.org/"
      cont: "quinobequin.org"
    - name: "Needham Muslim Neighbors"
      desc: "Informal community group connecting Needham's Muslim families with the wider town through interfaith potlucks (iftars) and outreach."
      href: "https://www.facebook.com/muslimneedham/"
      cont: "Facebook"
- title: "Civic Organizations"
  entries:
    - name: "Charles River Regional Chamber"
      desc: "Regional chamber of commerce (formerly Newton-Needham Regional Chamber) serving Newton, Needham, Watertown, Wellesley & Brookline businesses and nonprofits through advocacy, networking and events."
      href: "https://www.charlesriverchamber.com/"
      cont: "charlesriverchamber.com"
    - name: "Needham Interfaith Leaders / Clergy Association"
      desc: "Association of local clergy and faith leaders across denominations who coordinate on interfaith events and community issues. "
      href: "https://www.facebook.com/NeedhamInterfaith"
      cont: "Facebook"
    - name: "Friends of the Needham Public Library"
      desc: "Founded 1973; supports and enriches the Needham Free Public Library through book sales, programs, and fundraising"
      href: "https://www.friendsneedhamlibrary.org/"
      cont: "friendsneedhamlibrary.org"
    - name: "Needham Circle"
      desc: "A grassroots community effort dedicated to building a more connected community in Needham"
      href: "https://www.needhamcircle.org"
      cont: "needhamcircle.org"
    - name: "League of Women Voters - Needham (LWV)"
      desc: "Local chapter of the national nonpartisan League; promotes informed civic participation, runs candidate forums, and advocates on voting-rights issues."
      href: "https://lwv-needham.org/"
      cont: "lwv-needham.org"
    - name: "Library Foundation of Needham"
      desc: "501(c)(3) founded in 2003 as the permanent fundraising/endowment arm of the library"
      href: "https://www.lfnonline.org/"
      cont: "lfnonline.org"
    - name: "Needham Community Action Network (NCAN)"
      desc: "Formerly \"Community Center of Needham\"; grassroots group behind the Rosemary Recreation Center, now focused on recreation access, pedestrian safety, and teen space."
      href: "https://www.needhamcan.org/"
      cont: "needhamcan.org"
    - name: "Needham Diversity Initiative (NDI)"
      desc: "Community group (est. ~2012) fostering inclusion through events like the MLK Day celebration and the Needham Multicultural Festival."
      href: "https://www.needhamdiversity.org/"
      cont: "needhamdiversity.org"
    - name: "Needham Housing Coalition"
      desc: "Informal resident-led coalition advocating for more housing choice and affordability in Needham through education, research, and campaigns"
      href: "https://needhamhousingcoalition.org/"
      cont: "needhamhousingcoalition.org"
    - name: "Needham Resilience Network"
      desc: "Cross-sector network (est. 2022) of town leaders (faith, business, schools, police, government) building social cohesion and responding to hate/bias incidents."
      href: "https://nrnma.org/"
      cont: "nrnma.org"
    - name: "Needham Human Rights Committee (NHRC)"
      desc: "A Select Board-appointed town committee addressing human rights, bias incidents and equity issues; frequent co-sponsor of NDI and LWV events."
      href: "https://www.needhamma.gov/1110/Human-Rights-Committee"
      cont: "needhamma.gov"
    - name: "Center at the Heights (CATH)"
      desc: "The Center at the Heights (CATH) promotes health and wellness by providing a place to socialize and offering a variety of on-going recreational, health, educational, and informational programs and activities."
      href: "https://www.needhamma.gov/537/The-Center-at-the-Heights"
      cont: "needhamma.gov"
- title: "Education & Youth"
  entries:
    - name: "Needham Education Foundation (NEF)"
      desc: "Founded 1990 by NHS Class of '39 alumni; raises funds and awards grants for innovative programs in Needham's public schools."
      href: "https://www.nefneedham.org/"
      cont: "nefneedham.org"
    - name: "Parent Talk"
      desc: "All-volunteer nonprofit (est. 1991) helping families with young children connect via playgroups, an indoor playspace, and family events."
      href: "https://parenttalk.org/"
      cont: "parenttalk.org"
    - name: "Needham SEPAC"
      desc: "Special Education Parent Advisory Council — parent-run group giving feedback to the district on special-education policy and supporting families."
      href: "https://www.needhamsepac.org/"
      cont: "needhamsepac.org"
    - name: "Broadmeadow PTC"
      desc: "Parent-Teacher Council for Broadmeadow Elementary School."
      href: "https://sites.google.com/a/broadmeadowptc.org/home/"
      cont: "broadmeadowptc.org"
    - name: "Eliot PTC"
      desc: "Parent-Teacher Council for Eliot Elementary School."
      href: "https://www.johneliotptc.org/"
      cont: "johneliotptc.org"
    - name: "Mitchell PTC"
      desc: "Parent-Teacher Council for Mitchell Elementary School."
      href: "https://mitchellptc.org/"
      cont: "mitchellptc.org"
    - name: "Newman PTC"
      desc: "Parent-Teacher Council for Newman Elementary School."
      href: "https://newmanptc.org/"
      cont: "newmanptc.org"
    - name: "Sunita Williams PTC"
      desc: "Parent-Teacher Council for Sunita L. Williams Elementary School (formerly Hillside)."
      href: "https://www.sunitawilliamsptc.org/"
      cont: "sunitawilliamsptc.org"
    - name: "High Rock / Pollard PTC"
      desc: "Combined PTC serving High Rock School (grade 6) and Pollard Middle School (grades 7-8)."
      href: "https://www.needhammiddleptc.org/"
      cont: "needhammiddleptc.org"
    - name: "NHS PTC"
      desc: "Parent-Teacher Council for Needham High School."
      href: "https://needhamhighptc.org/"
      cont: "needhamhighptc.org"
- title: "Environment & Sustainability"
  entries:
    - name: "Green Needham (Collaborative)"
      desc: "Founded 2006; volunteer group partnering with residents, schools, businesses and town government to cut carbon emissions and promote sustainability."
      href: "https://www.greenneedham.org/"
      cont: "greenneedham.org"
    - name: "Needham Community Farm"
      desc: "501(c)(3) working farm providing food-education programs and donating fresh produce (via CSA and mobile market) to families facing food insecurity."
      href: "https://www.needhamfarm.org/"
      cont: "needhamfarm.org"
    - name: "Needham Farmers Market"
      desc: "Sunday farmers market (Jun-Oct) featuring local produce, flowers, and prepared foods; fun by a volunteer nonprofit board."
      href: "https://needhamfarmersmarket.org/"
      cont: "needhamfarmersmarket.org"
    - name: "Needham Garden Club"
      desc: "Federated garden club maintaining Noyes Garden, doing \"garden therapy\" at senior communities, and hosting horticulture/floral-design programs."
      href: "https://www.needhamgardenclub.com/"
      cont: "needhamgardenclub.com"
- title: "News Outlets"
  entries:
    - name: "Needham Observer"
      desc: "Free, independent, nonprofit hyperlocal news outlet founded by community members"
      href: "https://needhamobserver.com"
      cont: "needhamobserver.com"
    - name: "The Needham Channel (TNC)"
      desc: "Needham's public/educational/government (PEG) access television station, operating since the mid-1980s. Produces a weekly newscast, covers municipal meetings, sports, and community events across four cable channels; also streams online and via a free Roku app."
      href: "https://www.needhamchannel.org/"
      cont: "needhamchannel.org"
    - name: "Needham Local"
      desc: "Digital news arm of the Needham Channel, launched in 2023; pairs TNC's video coverage with written articles on town news, people, and events"
      href: "https://needhamlocal.com/"
      cont: "needhamlocal.com"
    - name: "The News You Need(ham)"
      desc: "The Town of Needham's official weekly e-newsletter, sent out by the town government with municipal announcements, alerts, and updates. Free to subscribe."
      href: "https://www.needhamma.gov/m/NewsFlash"
      cont: "needhamma.gov"
    - name: "Town of Needham YouTube Channel"
      desc: "Official municipal YouTube channel hosting recordings of Select Board, Planning Board, Town Meeting, and other public-body meetings."
      href: "https://youtube.com/user/TownofNeedhamMA"
      cont: "YouTube"
    - name: "Hometown Weekly (Needham edition)"
      desc: "Free weekly print newspaper (est. 1997) covering Needham, Medfield, Walpole, Dover-Sherborn and Westwood"
      href: "https://hometownweekly.net/needham-edition/"
      cont: "hometownweekly.net"
    - name: "Needham Patch"
      desc: "Local outlet of the national Patch.com hyperlocal news network; aggregates town announcements, crime/safety, politics, and community news along with an events calendar."
      href: "https://patch.com/massachusetts/needham"
      cont: "patch.com"
- title: "Recreation & Sports"
  entries:
    - name: "Needham Youth Track Club"
      desc: "Volunteer-run club offering low-pressure track & field training (sprint/distance) for kids ages 3.5-14, spring/summer/fall seasons."
      href: "https://needhamtrackclub.org/"
      cont: "needhamtrackclub.org"
    - name: "Needham Running Club"
      desc: "Established 2006 out of informal running/cycling/swimming socials; hosts a New Year's Day 5K and casual group runs."
      href: "https://sites.google.com/site/needhamrunningclub"
      cont: "sites.google.com"
    - name: "Needham Athletic Boosters (Needham HS Boosters)"
      desc: "501(c)(3) supporting all Needham High School student-athletes through fundraising (Sticker Drive, Rocket Run 5k) and recognition"
      href: "https://needhamhighschoolboosters.org/"
      cont: "needhamhighschoolboosters.org"
    - name: "Needham Baseball & Softball"
      desc: "Runs instructional and competitive baseball/softball leagues (spring, summer, fall) for players ages 6-18, including a Challenger Division for adaptive baseball."
      href: "https://needhambaseball.com/"
      cont: "needhambaseball.com"
    - name: "Great Bear Run"
      desc: "Annual USATF-certified 5K plus kids' races, centered at Pollard Middle School each May; a community fundraising road-race event."
      href: "https://greatbearrun.godaddysites.com/"
      cont: "greatbearrun.godaddysites.com"
    - name: "Let's Bike! Needham"
      desc: "Local cycling group offering regular rides locally; open to all"
      href: "https://www.letsbikeneedham.com"
      cont: "letsbikeneedham.com"
    - name: "Needham Soccer Club"
      desc: "Town-wide youth soccer club for grades 1-12 (ages 7-18); runs travel and in-town programs in fall and spring, plus a well-known Memorial Day tournament that draws clubs from across the Northeast and Canada."
      href: "https://needhamsoccer.com/"
      cont: "needhamsoccer.com"
    - name: "Needham Youth Hockey Association (NYH)"
      desc: "Nonprofit youth hockey program (ages 4-17) for Needham and Dover, with in-house development and competitive travel teams."
      href: "https://needhamyouthhockey.org/"
      cont: "needhamyouthhockey.org"
    - name: "Needham Youth Basketball League (NYBL)"
      desc: "Recreational basketball league for grades 1-8; emphasizes participation and sportsmanship over competition."
      href: "https://needhamyouthbasketballleague.com"
      cont: "needhamyouthbasketballleague.com"
    - name: "Needham Boys Youth Lacrosse"
      desc: "Developmental and travel lacrosse program for boys grades K-8."
      href: "https://needhamboyslacrosse.com/"
      cont: "needhamboyslacrosse.com"
    - name: "Needham Girls Youth Lacrosse (NGYL)"
      desc: "Developmental lacrosse program for girls grades 1-8, with select travel teams for older grades."
      href: "https://www.needhamlacrosse.com/"
      cont: "needhamlacrosse.com"
    - name: "Needham Junior Football & Cheer (NJFC)"
      desc: "Youth tackle football and competitive cheerleading program culminating in a fall season of games and cheer competitions."
      href: "https://needhamfootball.net/"
      cont: "needhamfootball.net"
    - name: "Needham Youth Field Hockey"
      desc: "Non-competitive, inclusive field hockey league for grades 1-8, founded 2020; offers fall (league) and spring (clinic) seasons."
      href: "https://www.needhamyouthfieldhockey.com/"
      cont: "needhamyouthfieldhockey.com"
- title: "Service & Philanthropy"
  entries:
    - name: "Needham Exchange Club"
      desc: "Local chapter of the National Exchange Club, serving Needham since 1947; organizes the town's July 4th celebration and other community-service projects."
      href: "https://www.needhamexchangeclub.org/"
      cont: "needhamexchangeclub.org"
    - name: "Needham VFW Post 2498"
      desc: "Lt. Manson H. Carter VFW Post; serves veterans of foreign wars from Needham and nearby towns and rents its hall for community events."
      href: "https://vfw2498.org/"
      cont: "vfw2498.org"
    - name: "Substance Prevention Alliance of Needham (SPAN)"
      desc: "Community coalition (partnered with Needham Public Health) working to reduce youth alcohol/drug use through education and data-driven prevention."
      href: "https://www.spanneedham.org/"
      cont: "spanneedham.org"
    - name: "Be Kind Needham"
      desc: "Grassroots Facebook-based group where neighbors coordinate donations and support for families in need."
      href: "https://www.facebook.com/groups/1005101936506512/"
      cont: "Facebook"
    - name: "Needham Women's Club"
      desc: "Intergenerational women's club (est. 1935), affiliate of the General Federation of Women's Clubs; volunteers and fundraises for community causes."
      href: "https://needhamwomensclub.org/"
      cont: "needhamwomensclub.org"
    - name: "Needham Community Council"
      desc: "Private nonprofit providing a food pantry, thrift store, transportation, ELL tutoring and other social-service supports for Needham residents in need."
      href: "https://needhamcouncil.org/"
      cont: "needhamcouncil.org"
    - name: "Circle of Hope"
      desc: "Needham-based nonprofit collecting and distributing clothing/hygiene essentials to people experiencing homelessness across Greater Boston."
      href: "https://www.circleofhopeonline.org/"
      cont: "circleofhopeonline.org"
    - name: "Rotary Club of Needham"
      desc: "Local Rotary chapter; runs the Needham Carnival, scholarships, and community service projects."
      href: "https://needhamrotaryclub.org/"
      cont: "needhamrotaryclub.org"
    - name: "Friends of the Center at the Heights"
      desc: "Nonprofit supporting programs and services for Needham's senior residents, partnering with the Council on Aging & CATH."
      href: "https://www.needhamma.gov/531/Friends-of-the-Needham-Elderly"
      cont: "needhamma.gov"
